<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <title>Pol-eat-heck | Compte</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="index.html">Pol-eat-heck</a>

        <nav>
            <a href="menus.html">Menus</a>
            <a href="products.html">Produits</a>
            <a href="cart.html" class="user-only">Panier</a>
            <a href="account.html" class="user-only">Compte</a>
            <a href="admin.html" class="admin-only">Administration</a>

            <button id="logout-btn" class="user-only">Déconnexion</button>
        </nav>
    </header>
    <main>
        <section>
            <h2>Récapitulatif des commandes</h2>
        </section>
        <section>
            <h2>Changement du mot de passe</h2>
            <form id="password-form">
                <label for="old-password">Mot de passe actuel</label>
                <input type="password" id="old-password" required>

                <label for="new-password">Nouveau mot de passe</label>
                <input type="password" id="new-password" minlength="6" required>

                <button type="submit">Changer de mot de passe</button>
            </form>

            <p id="password-error" class="error-msg"></p>
            <p id="password-success" class="success-msg"></p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>

</html>
